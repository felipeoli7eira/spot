services:
    spot_nginx:
        image: nginx
        container_name: spot-nginx
        ports:
            - 8000:80
        hostname: spot-nginx-hostname
        restart: on-failure:3
        volumes:
            - ./docker/containers/nginx/nginx.conf:/etc/nginx/nginx.conf
            - ./application:/var/www/html
        depends_on:
            spot_backend:
                condition: service_healthy
                restart: true

    spot_backend:
        container_name: spot-backend
        hostname: spot-hostname
        build:
            context: .
            dockerfile: ./docker/images/php/Dockerfile
        volumes:
            - ./application:/var/www/html
        restart: on-failure:3
        expose:
            - "9000"
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "SCRIPT_NAME=/ping SCRIPT_FILENAME=/ping REQUEST_METHOD=GET cgi-fcgi -bind -connect 127.0.0.1:9000 | grep pong || exit 1",
                ]
            interval: 5s
            timeout: 3s
            retries: 3
        depends_on:
            spot_mysql:
                condition: service_healthy
                restart: true

    spot_mysql:
        image: mysql:8.0
        container_name: spot-mysql
        restart: always
        ports:
            - 3306:3306
        env_file:
            - ./docker/containers/mysql/env/.env.dev
        volumes:
            - spot_mysql_data:/var/lib/mysql
        healthcheck:
            test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
            interval: 5s
            timeout: 3s
            retries: 5
            start_period: 5s

volumes:
  spot_mysql_data:

networks:
    default:
        name: spot-net
        driver: bridge
